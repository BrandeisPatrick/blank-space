service: blankspace-api

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 1024
  timeout: 60
  environment:
    NODE_ENV: ${self:provider.stage}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
    GOOGLE_AI_API_KEY: ${env:GOOGLE_AI_API_KEY}
    FIREBASE_PROJECT_ID: ${env:FIREBASE_PROJECT_ID}
    FIREBASE_PRIVATE_KEY: ${env:FIREBASE_PRIVATE_KEY}
    FIREBASE_CLIENT_EMAIL: ${env:FIREBASE_CLIENT_EMAIL}

  # CORS configuration
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS

functions:
  # Chat endpoint (OpenAI proxy)
  chat:
    handler: src/handlers/chat.handler
    events:
      - httpApi:
          path: /api/chat
          method: POST

  # Gemini endpoint (Google AI proxy)
  gemini:
    handler: src/handlers/gemini.handler
    events:
      - httpApi:
          path: /api/gemini
          method: POST

  # File operations
  files:
    handler: src/handlers/files.handler
    events:
      - httpApi:
          path: /api/files
          method: ANY
      - httpApi:
          path: /api/files/{proxy+}
          method: ANY

  # Conversations
  conversations:
    handler: src/handlers/conversations.handler
    events:
      - httpApi:
          path: /api/conversations
          method: ANY
      - httpApi:
          path: /api/conversations/{proxy+}
          method: ANY

  # User endpoints
  userProfile:
    handler: src/handlers/user.profileHandler
    events:
      - httpApi:
          path: /api/user/profile
          method: ANY

  userUsage:
    handler: src/handlers/user.usageHandler
    events:
      - httpApi:
          path: /api/user/usage
          method: GET

  userIncrementUsage:
    handler: src/handlers/user.incrementUsageHandler
    events:
      - httpApi:
          path: /api/user/increment-usage
          method: POST

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3001
