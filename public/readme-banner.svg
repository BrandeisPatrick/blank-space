<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 1200 200">
  <defs>
    <!-- Christmas gradient -->
    <linearGradient id="xmasGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#165B33"/>
      <stop offset="50%" style="stop-color:#C41E3A"/>
      <stop offset="100%" style="stop-color:#165B33"/>
    </linearGradient>

    <!-- Rounded rectangle clip path -->
    <clipPath id="roundedClip">
      <rect x="20" y="10" width="1160" height="180" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <!-- Rounded container -->
  <g clip-path="url(#roundedClip)">
    <!-- Base gradient background -->
    <rect x="20" y="10" width="1160" height="180" rx="20" ry="20" fill="url(#xmasGrad)"/>

    <!-- Frosted glass overlay layers -->
    <rect x="20" y="10" width="1160" height="180" fill="white" opacity="0.08"/>
    <rect x="20" y="10" width="1160" height="90" fill="white" opacity="0.05"/>

    <!-- Subtle glass shine -->
    <ellipse cx="600" cy="40" rx="700" ry="50" fill="white" opacity="0.1"/>
  </g>

  <!-- Rounded border -->
  <rect x="20" y="10" width="1160" height="180" rx="20" ry="20" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Text with twinkling animation -->
  <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle"
        fill="#E0E0E0" font-size="70" font-family="Nunito, Varela Round, Quicksand, Arial Rounded MT Bold, sans-serif" font-weight="600"
        style="text-shadow: 0 2px 10px rgba(0,0,0,0.4);">
    blank space
    <animate attributeName="opacity" values="1;0.75;1" dur="8s" repeatCount="indefinite"/>
  </text>
</svg>
